# Fail2Ban configuration file
#
# Author: CdE-Datenbankteam
[Definition]
# Matches messages such as:
# User 1234 tried to decrypt anonymous message (...) with an incorrect decryption key.
journalmatch = _SYSTEMD_UNIT=cdedb-app.service LOGGER=cdedb.backend.session MESSAGE='User .* tried to decrypt anonymous message .* with an incorrect decryption key.'
ignoreregex =
